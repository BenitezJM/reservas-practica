spring:
  application:
    name: reservas-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    contexts: dev, local, test

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
