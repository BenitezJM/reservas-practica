spring:
  application:
    name: reservas-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cold-lab-bc4ijtpe-pooler.c-16.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
